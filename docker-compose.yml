services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: groupor
      POSTGRES_PASSWORD: groupor
      POSTGRES_DB: groupor
    ports:
      - "5432:5432"
    volumes:
      - groupor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupor -d groupor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://groupor:groupor@db:5432/groupor
      SITE_URL: http://localhost:8000
      SITE_NAME: Groupor
      SESSION_SECRET: change-me-in-production-use-long-random-string
      # Future Redis (optional):
      # REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy

volumes:
  groupor_pg:
